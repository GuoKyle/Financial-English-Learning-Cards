name: Auto Generate TTS Audio

on:
  push:
    paths:
      - 'cards.json'
      - 'generate_audio.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-audio:
    runs-on: ubuntu-latest

    steps:
      - name: 检出仓库代码
        uses: actions/checkout@v4

      - name: 配置 Python 环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装 edge-tts
        run: |
          pip install edge-tts

      - name: 增量生成卡片音频
        run: |
          python generate_audio.py

      - name: 提交音频到仓库
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: auto-generate TTS audio files [skip ci]"
          file_pattern: "audio/**/*.mp3"
