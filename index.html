<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f5f5f7">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>双语研习卡片</title>
<style>
:root {
  --bg-color: #f5f5f7;
  --card-bg: #ffffff;
  --text-main: #1d1d1f;
  --text-secondary: #86868b;
  --accent-blue: #0066cc;
  --accent-light: #e8f0fe;
  --border-color: #d2d2d7;
  --shadow-sm: 0 2px 10px rgba(0,0,0,0.03);
  --shadow-md: 0 10px 30px rgba(0,0,0,0.06);
}

* { box-sizing: border-box; }
body {
  margin: 0;
  background-color: var(--bg-color);
  color: var(--text-main);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  display: flex;
  flex-direction: column;
  min-height: 100vh;
}

header {
  padding: 20px 24px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  max-width: 800px;
  margin: 0 auto;
  width: 100%;
}
.title-area h1 { margin: 0; font-size: 20px; font-weight: 600; letter-spacing: -0.02em; }
.title-area p { margin: 4px 0 0; font-size: 13px; color: var(--text-secondary); }
.issue-badge {
  background: var(--card-bg);
  border: 1px solid var(--border-color);
  padding: 6px 12px;
  border-radius: 20px;
  font-size: 13px;
  font-weight: 500;
  color: var(--text-main);
  box-shadow: var(--shadow-sm);
}

main {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 20px 24px;
  max-width: 800px;
  margin: 0 auto;
  width: 100%;
}

/* Common Card Styles */
.card-wrapper {
  width: 100%;
  max-width: 600px;
  min-height: 420px;
  cursor: pointer;
  position: relative;
}

.tag {
  display: inline-block;
  background: var(--accent-light);
  color: var(--accent-blue);
  padding: 4px 10px;
  border-radius: 8px;
  font-size: 12px;
  font-weight: 600;
  margin-bottom: 20px;
}

.note-box {
  background: #f9f9fb;
  border-left: 3px solid #d2d2d7;
  padding: 12px 16px;
  border-radius: 0 8px 8px 0;
  font-size: 13px;
  color: #555;
  margin-top: 24px;
  line-height: 1.6;
}

/* --- Term Card (Flip) --- */
.term-container {
  perspective: 1400px;
  width: 100%;
  height: 100%;
  min-height: 420px;
}
.term-inner {
  position: relative;
  width: 100%;
  height: 100%;
  transition: transform 0.5s cubic-bezier(0.2, 0.8, 0.2, 1);
  transform-style: preserve-3d;
}
.term-inner.flip { transform: rotateY(180deg); }
.term-face {
  position: absolute;
  inset: 0;
  background: var(--card-bg);
  border-radius: 20px;
  box-shadow: var(--shadow-md);
  padding: 40px;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  text-align: center;
  backface-visibility: hidden;
  -webkit-backface-visibility: hidden;
}
.term-back { transform: rotateY(180deg); }
.term-text { font-size: 28px; font-weight: 600; line-height: 1.4; color: var(--text-main); }
.term-back .term-text { font-size: 22px; font-weight: 500; }

/* --- Sentence Card (Expand) --- */
.sentence-container {
  background: var(--card-bg);
  border-radius: 20px;
  box-shadow: var(--shadow-md);
  padding: 40px;
  display: flex;
  flex-direction: column;
  width: 100%;
  min-height: 420px;
  transition: all 0.3s ease;
}
.sentence-front {
  font-size: 20px;
  line-height: 1.8;
  font-weight: 500;
  color: var(--text-main);
}
.sentence-divider {
  height: 1px;
  background: var(--border-color);
  margin: 24px 0;
  opacity: 0.5;
}
.sentence-back-text {
  font-size: 18px;
  line-height: 1.7;
  color: #333336;
}

.hint-text {
  margin-top: auto;
  padding-top: 30px;
  text-align: center;
  font-size: 13px;
  color: var(--text-secondary);
}

/* Controls */
.controls {
  display: flex;
  justify-content: space-between;
  align-items: center;
  width: 100%;
  max-width: 600px;
  margin: 30px auto 40px;
  padding: 0 24px;
}
.btn {
  background: #ffffff;
  border: 1px solid var(--border-color);
  color: var(--text-main);
  padding: 12px 20px;
  border-radius: 12px;
  font-size: 15px;
  font-weight: 500;
  cursor: pointer;
  box-shadow: var(--shadow-sm);
  transition: all 0.2s;
}
.btn:hover { background: #f9f9fb; }
.btn:active { transform: scale(0.97); }
.counter { font-size: 14px; color: var(--text-secondary); font-variant-numeric: tabular-nums; }

@media(max-width: 600px) {
  .term-face, .sentence-container { padding: 30px 24px; }
  .term-text { font-size: 24px; }
  .term-back .term-text { font-size: 20px; }
  .sentence-front { font-size: 18px; }
  .sentence-back-text { font-size: 16px; }
}
</style>
</head>
<body>

<header>
  <div class="title-area">
    <h1>双语研习库</h1>
    <p>术语提取 · 视译研读</p>
  </div>
  <div class="issue-badge" id="issue-display">第 01 期</div>
</header>

<main>
  <div class="card-wrapper" id="card-area">
    
    <!-- 术语卡片：翻转效果 -->
    <div class="term-container" id="term-view" style="display: none;">
      <div class="term-inner" id="term-inner">
        <!-- 正面 -->
        <div class="term-face">
          <div class="tag" id="term-tag"></div>
          <div class="term-text" id="term-front"></div>
          <div class="hint-text">点击卡片查看对照</div>
        </div>
        <!-- 背面 -->
        <div class="term-face term-back">
          <div class="tag">参考译文</div>
          <div class="term-text" id="term-back"></div>
          <div class="note-box" id="term-note"></div>
        </div>
      </div>
    </div>

    <!-- 句子卡片：上下展开效果 -->
    <div class="sentence-container" id="sentence-view" style="display: none;">
      <div class="tag" id="sentence-tag"></div>
      <div class="sentence-front" id="sentence-front"></div>
      
      <div id="sentence-back-wrapper" style="display: none;">
        <div class="sentence-divider"></div>
        <div class="sentence-back-text" id="sentence-back"></div>
        <div class="note-box" id="sentence-note"></div>
      </div>
      
      <div class="hint-text" id="sentence-hint">点击空白处展开对照</div>
    </div>

  </div>
</main>

<div class="controls">
  <button class="btn" id="btn-prev">← 上一页</button>
  <div class="counter" id="counter">1 / 6</div>
  <button class="btn" id="btn-next">下一页 →</button>
</div>

<script>
let pool = [];
let currentIdx = 0;
const $ = id => document.getElementById(id);

// 核心渲染逻辑
function renderCard() {
  if (!pool.length) return;
  const card = pool[currentIdx];
  $('counter').textContent = `${currentIdx + 1} / ${pool.length}`;
  $('issue-display').textContent = `第 ${card.issue} 期`;

  if (card.type === 'term') {
    // 渲染术语卡片
    $('term-view').style.display = 'block';
    $('sentence-view').style.display = 'none';
    $('term-inner').classList.remove('flip'); // 重置翻转状态

    $('term-tag').textContent = card.tag;
    $('term-front').textContent = card.front;
    $('term-back').textContent = card.back;
    
    if (card.note) {
      $('term-note').textContent = card.note;
      $('term-note').style.display = 'block';
    } else {
      $('term-note').style.display = 'none';
    }

  } else {
    // 渲染句子卡片
    $('term-view').style.display = 'none';
    $('sentence-view').style.display = 'flex';
    $('sentence-back-wrapper').style.display = 'none'; // 初始隐藏背面
    $('sentence-hint').style.display = 'block';

    $('sentence-tag').textContent = card.tag;
    $('sentence-front').textContent = card.front;
    $('sentence-back').textContent = card.back;

    if (card.note) {
      $('sentence-note').textContent = card.note;
      $('sentence-note').style.display = 'block';
    } else {
      $('sentence-note').style.display = 'none';
    }
  }
}

// 交互逻辑：点击术语翻转
$('term-view').onclick = () => {
  $('term-inner').classList.toggle('flip');
};

// 交互逻辑：点击句子展开
$('sentence-view').onclick = () => {
  const wrapper = $('sentence-back-wrapper');
  const hint = $('sentence-hint');
  if (wrapper.style.display === 'none') {
    wrapper.style.display = 'block';
    hint.style.display = 'none';
  }
};

// 按钮导航
$('btn-prev').onclick = () => {
  if (pool.length === 0) return;
  currentIdx = (currentIdx - 1 + pool.length) % pool.length;
  renderCard();
};
$('btn-next').onclick = () => {
  if (pool.length === 0) return;
  currentIdx = (currentIdx + 1) % pool.length;
  renderCard();
};

// 键盘左右键导航，空格键翻转/展开
document.onkeydown = (e) => {
  if (e.key === "ArrowRight") $('btn-next').click();
  else if (e.key === "ArrowLeft") $('btn-prev').click();
  else if (e.key === " ") {
    e.preventDefault();
    const card = pool[currentIdx];
    if (card.type === 'term') $('term-view').click();
    else $('sentence-view').click();
  }
};

// 加载数据
fetch("cards.json")
  .then(res => res.json())
  .then(data => {
    pool = data;
    renderCard();
  })
  .catch(err => {
    $('term-view').style.display = 'block';
    $('term-front').textContent = "数据加载失败";
    $('term-note').textContent = "请确保当前环境支持 fetch 请求，且 cards.json 存在。";
  });
</script>
</body>
</html>
