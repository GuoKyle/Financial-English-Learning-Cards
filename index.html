<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b1f3a">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>双语学习卡片</title>
<style>
:root{
  --navy:#0b1f3a;
  --navy-2:#17375e;
  --blue:#1f5fa8;
  --blue-soft:#eef5fc;
  --gold:#b68b2c;
  --gold-soft:#fbf6e8;
  --ink:#182230;
  --muted:#657386;
  --line:#dfe6ee;
  --bg:#f4f6f9;
  --white:#fff;
  --green:#1f7a4d;
  --shadow:0 14px 40px rgba(11,31,58,.08);
}

*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0;
  background:linear-gradient(180deg,#f7f9fb 0,#f3f5f8 100%);
  color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",
  "Hiragino Sans GB","Microsoft YaHei",Arial,sans-serif;
}

.app{max-width:1040px;margin:0 auto;padding:0 16px 44px}
.topbar{
  margin:0 -16px 22px;
  background:linear-gradient(135deg,var(--navy) 0%,#12345a 100%);
  color:#fff;
  padding:22px max(16px,calc((100vw - 1040px)/2 + 16px)) 20px;
  box-shadow:0 6px 22px rgba(11,31,58,.14);
}
.brand-row{
  display:flex;justify-content:space-between;gap:18px;align-items:flex-start;
}
.eyebrow{
  display:flex;align-items:center;gap:8px;
  text-transform:uppercase;letter-spacing:.08em;
  font-size:11px;color:#b8cadc;font-weight:700;
}
.dot{width:7px;height:7px;border-radius:50%;background:var(--gold)}
h1{font-size:29px;line-height:1.18;margin:7px 0 5px;font-weight:720;letter-spacing:-.02em}
.sub{font-size:13px;color:#d4deea;line-height:1.6}
.issue{
  color:#f7df9a;border:1px solid rgba(247,223,154,.45);
  border-radius:999px;padding:7px 11px;font-size:12px;font-weight:700;white-space:nowrap;
}

.panel{
  background:rgba(255,255,255,.96);
  border:1px solid var(--line);
  border-radius:17px;
  padding:12px;
  margin-bottom:12px;
  box-shadow:0 5px 20px rgba(11,31,58,.04);
}
.tabs{display:flex;gap:8px;overflow:auto;padding:1px}
.tab{
  border:1px solid var(--line);background:#fff;color:var(--muted);
  border-radius:10px;padding:9px 13px;white-space:nowrap;min-height:40px;
  font-weight:600;cursor:pointer;
}
.tab.active{background:var(--navy);border-color:var(--navy);color:#fff}

.search{
  width:100%;border:1px solid var(--line);border-radius:12px;padding:12px 13px;
  font-size:15px;outline:none;background:#fbfcfe;
}
.search:focus{border-color:#8cafcf;box-shadow:0 0 0 3px rgba(31,95,168,.08)}
.controls{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
button,select{
  font:inherit;border:1px solid var(--line);background:#fff;color:var(--ink);
  border-radius:11px;padding:10px 12px;min-height:42px;cursor:pointer;
}
button.primary{background:var(--blue);border-color:var(--blue);color:#fff}
button.gold{background:var(--gold-soft);border-color:#ead9a9;color:#7f6220}

.progressline{
  display:flex;justify-content:space-between;color:var(--muted);
  font-size:12px;margin:10px 2px 7px;
}
.bar{height:6px;background:#e8edf3;border-radius:999px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--blue),#5f92c5);transition:width .25s}

/* 统一卡片基础样式 */
.card-wrapper{margin-top:14px;cursor:pointer;}
.meta-row{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:15px;}
.pill{
  font-size:11px;font-weight:700;letter-spacing:.02em;
  color:var(--blue);background:var(--blue-soft);
  border:1px solid #d9e8f8;padding:6px 10px;border-radius:999px;
}
.mini{font-size:11px;color:#8793a2}
.note{
  font-size:13px;line-height:1.72;color:#4f5e6d;
  background:#f8fafc;border:1px solid #e9eef3;
  padding:12px 14px;border-radius:13px;margin-top:15px;
}
.note::before{
  content:"学习提示";
  display:block;font-size:10px;font-weight:800;letter-spacing:.08em;
  color:var(--gold);margin-bottom:4px;text-transform:uppercase;
}
.hint{text-align:center;color:#8a95a3;font-size:12px;margin-top:20px}

/* 1. 术语卡片样式 (3D翻转) */
.term-card{perspective:1400px;touch-action:pan-y;}
.term-inner{
  position:relative;min-height:430px;
  transform-style:preserve-3d;transition:transform .48s cubic-bezier(.2,.7,.2,1);
}
.term-inner.flip{transform:rotateY(180deg)}
.term-face{
  position:absolute;inset:0;
  background:#fff;border:1px solid #dce4ed;border-radius:24px;
  box-shadow:var(--shadow);padding:26px 28px;
  display:flex;flex-direction:column;
  backface-visibility:hidden;-webkit-backface-visibility:hidden;
}
.term-back{transform:rotateY(180deg)}
.term-label{
  font-size:11px;letter-spacing:.08em;text-transform:uppercase;
  color:#8995a3;font-weight:700;
}
.term-text{
  flex:1;display:flex;align-items:center;justify-content:center;
  text-align:center;white-space:pre-wrap;overflow-wrap:anywhere;
  line-height:1.72;font-size:clamp(24px,4.5vw,36px);
  font-weight:680;letter-spacing:-.01em;padding:16px 10px;
}
.term-back .term-text{
  display:block;align-self:stretch;
  text-align:left;font-size:clamp(18px,3.5vw,24px);
  line-height:1.95;font-weight:450;letter-spacing:0;padding:18px 4px 10px;
}
.term-divider{height:1px;background:#edf1f5;margin:4px 0 11px}

/* 2. 句子卡片样式 (上下展开) */
.sentence-card{
  background:#fff;border:1px solid #dce4ed;border-radius:24px;
  box-shadow:var(--shadow);padding:26px 28px;
  min-height:430px;display:flex;flex-direction:column;
}
.sentence-front{
  font-size:clamp(18px,4vw,22px);line-height:1.8;font-weight:500;color:var(--ink);
}
.sentence-divider{height:1px;background:#edf1f5;margin:24px 0;opacity:0.8;}
.sentence-back-text{
  font-size:clamp(16px,3.5vw,19px);line-height:1.7;color:#333336;
}

/* 底部操作区 */
.actions{display:grid;grid-template-columns:1fr 1.35fr 1fr;gap:8px;margin-top:14px}
.actions button{min-height:48px;font-weight:650}
.subactions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.stat{
  background:#fff;border:1px solid var(--line);border-radius:13px;
  padding:11px;text-align:center;box-shadow:0 4px 14px rgba(11,31,58,.03)
}
.stat b{display:block;font-size:18px;color:var(--navy)}
.stat span{font-size:11px;color:var(--muted)}

@media(max-width:620px){
  .app{padding:0 12px 34px}
  .topbar{margin:0 -12px 18px;padding:18px 12px 17px}
  h1{font-size:25px}
  .brand-row{gap:10px}
  .issue{font-size:11px;padding:6px 9px}
  .controls{grid-template-columns:1fr}
  .term-inner,.sentence-card{min-height:455px}
  .term-face,.sentence-card{padding:21px 18px;border-radius:21px}
  .term-text{font-size:clamp(22px,6vw,31px);padding:10px 2px}
  .term-back .term-text{font-size:clamp(17px,4.7vw,21px);line-height:1.9}
}
</style>
</head>
<body>
<div class="app">

<!-- 顶部 Header -->
<header class="topbar">
  <div class="brand-row">
    <div>
      <div class="eyebrow"><span class="dot"></span> Bilingual Learning Series</div>
      <h1>双语学习卡片</h1>
      <div class="sub">政经英语 · 金融英语 · 官方表达</div>
    </div>
    <div class="issue" id="issue">第 01 期</div>
  </div>
</header>

<!-- 期数 Tabs -->
<section class="panel">
  <div class="tabs" id="tabs"></div>
</section>

<!-- 搜索与筛选控制区 -->
<section class="panel">
  <input class="search" id="search" placeholder="搜索中文、英文或标签……">
  <div class="controls">
    <select id="type">
      <option value="all">全部内容</option>
      <option value="term">术语与短语</option>
      <option value="sentence">句子与长段</option>
    </select>
    <button id="shuffle">🔀 随机练习</button>
  </div>
</section>

<!-- 进度条 -->
<div class="progressline"><span id="counter">1 / 6</span><span id="progressText">已掌握 0</span></div>
<div class="bar"><i id="bar"></i></div>

<main>

<!-- 1. 术语卡片容器 (翻转) -->
<div class="card-wrapper term-card" id="term-view" style="display:none;">
  <div class="term-inner" id="term-inner">
    <section class="term-face">
      <div class="meta-row">
        <span class="pill" id="term-tag">术语</span>
        <span class="mini">瞬时提取提取训练</span>
      </div>
      <div class="term-label">Front · 正面</div>
      <div class="term-text" id="term-front"></div>
      <div class="hint">点击卡片或下方按钮翻转查看</div>
    </section>
    <section class="term-face term-back">
      <div class="meta-row">
        <span class="pill">参考答案</span>
        <span class="mini">Back · 背面</span>
      </div>
      <div class="term-label">Reference · 参考译文</div>
      <div class="term-text" id="term-back"></div>
      <div class="term-divider"></div>
      <div class="note" id="term-note"></div>
    </section>
  </div>
</div>

<!-- 2. 句子卡片容器 (上下展开) -->
<div class="card-wrapper sentence-card" id="sentence-view" style="display:none;">
  <div class="meta-row" style="margin-bottom:20px;">
    <span class="pill" id="sentence-tag">句子</span>
    <span class="mini">视译与句法研读</span>
  </div>
  <div class="sentence-front" id="sentence-front"></div>
  
  <div id="sentence-back-wrapper" style="display:none;">
    <div class="sentence-divider"></div>
    <div class="sentence-back-text" id="sentence-back"></div>
    <div class="note" id="sentence-note"></div>
  </div>
  
  <div class="hint" id="sentence-hint" style="margin-top:auto; padding-top:20px;">点击卡片或下方按钮展开双语对照</div>
</div>

<!-- 操作区 -->
<div class="actions">
  <button id="prev">← 上一张</button>
  <button class="primary" id="flip-btn">显示答案</button>
  <button id="next">下一张 →</button>
</div>

<div class="subactions">
  <button id="again">🤔 再练</button>
  <button class="gold" id="know">✓ 已掌握</button>
</div>

<div class="stats">
  <div class="stat"><b id="total">0</b><span>当前卡组</span></div>
  <div class="stat"><b id="known">0</b><span>已掌握</span></div>
  <div class="stat"><b id="fav">0</b><span>已加入错题/再练</span></div>
</div>

</main>
</div>

<script>
let all=[], pool=[], idx=0, flipped=false, expanded=false, issue="01";
let state=JSON.parse(localStorage.getItem("bilingual-card-state")||'{"known":[],"fav":[],"wrong":[]}');
const $=id=>document.getElementById(id);

function save(){localStorage.setItem("bilingual-card-state",JSON.stringify(state));}
function issueList(){return [...new Set(all.map(x=>x.issue))].sort();}

function renderTabs(){
  $("tabs").innerHTML=issueList().map(x=>`<button class="tab ${x===issue?'active':''}" data-i="${x}">第 ${x} 期</button>`).join("");
  document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>{issue=b.dataset.i;build();});
}

function build(preserve){
  const t=$("type").value,s=$("search").value.trim().toLowerCase();
  pool=all.filter(x=>x.issue===issue&&(t==="all"||x.type===t)&&(!s||(x.front+" "+x.back+" "+x.tag+" "+x.note).toLowerCase().includes(s)));
  if(preserve){const p=pool.findIndex(x=>x.id===preserve);idx=p<0?0:p;}
  else idx=Math.min(idx,Math.max(pool.length-1,0));
  render();
}

function render(){
  renderTabs();
  $("issue").textContent=`第 ${issue} 期`;
  if(!pool.length){
    $("term-view").style.display="block";
    $("sentence-view").style.display="none";
    $("term-front").textContent="没有找到卡片，请更换搜索词或筛选条件";
    $("term-back").textContent="";
    $("term-note").style.display="none";
    $("counter").textContent="0 / 0";
    $("progressText").textContent="已掌握 0";
    $("bar").style.width="0%";
    return;
  }
  
  const c=pool[idx];
  flipped=false;
  expanded=false;
  
  // 更新进度与统计
  $("counter").textContent=`${idx+1} / ${pool.length}`;
  const k=pool.filter(x=>state.known.includes(x.id)).length;
  $("progressText").textContent=`已掌握 ${k}`;
  $("bar").style.width=(k/pool.length*100)+"%";
  $("total").textContent=pool.length;
  $("known").textContent=state.known.length;
  $("fav").textContent=state.wrong.length; // 这里将fav位置用来显示"再练"数量，可根据需要调整

  // 根据卡片类型切换视图
  if(c.type === 'term') {
    $("term-view").style.display="block";
    $("sentence-view").style.display="none";
    $("term-inner").classList.remove("flip");
    $("flip-btn").textContent="显示答案";
    
    $("term-tag").textContent=c.tag;
    $("term-front").textContent=c.front;
    $("term-back").textContent=c.back;
    if(c.note){ $("term-note").textContent=c.note; $("term-note").style.display="block"; }
    else{ $("term-note").style.display="none"; }
    
  } else {
    $("term-view").style.display="none";
    $("sentence-view").style.display="flex";
    $("sentence-back-wrapper").style.display="none";
    $("sentence-hint").style.display="block";
    $("flip-btn").textContent="展开对照";
    
    $("sentence-tag").textContent=c.tag;
    $("sentence-front").textContent=c.front;
    $("sentence-back").textContent=c.back;
    if(c.note){ $("sentence-note").textContent=c.note; $("sentence-note").style.display="block"; }
    else{ $("sentence-note").style.display="none"; }
  }
}

// 统一的处理翻转/展开逻辑
function toggleCard(){
  if(!pool.length)return;
  const c = pool[idx];
  if(c.type === 'term') {
    flipped = !flipped;
    $("term-inner").classList.toggle("flip", flipped);
    $("flip-btn").textContent = flipped ? "返回正面" : "显示答案";
  } else {
    expanded = !expanded;
    $("sentence-back-wrapper").style.display = expanded ? "block" : "none";
    $("sentence-hint").style.display = expanded ? "none" : "block";
    $("flip-btn").textContent = expanded ? "收起对照" : "展开对照";
  }
}

function next(){if(!pool.length)return;idx=(idx+1)%pool.length;render();}
function prev(){if(!pool.length)return;idx=(idx-1+pool.length)%pool.length;render();}

$("flip-btn").onclick=toggleCard;
$("term-view").onclick=toggleCard;
$("sentence-view").onclick=toggleCard;

$("next").onclick=next;
$("prev").onclick=prev;

$("know").onclick=()=>{
  if(!pool.length)return;
  const id=pool[idx].id;
  if(!state.known.includes(id)){
    state.known.push(id);
    // 如果掌握了，从错题中移除
    state.wrong = state.wrong.filter(x => x !== id);
  }
  save();render();setTimeout(next,170);
};

$("again").onclick=()=>{
  if(!pool.length)return;
  const id=pool[idx].id;
  if(!state.wrong.includes(id))state.wrong.push(id);
  // 如果加入错题，从掌握中移除
  state.known = state.known.filter(x => x !== id);
  save();next();
};

$("shuffle").onclick=()=>{
  for(let i=pool.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [pool[i],pool[j]]=[pool[j],pool[i]];
  }
  idx=0;render();
};

$("type").onchange=()=>build();
$("search").oninput=()=>build();

document.onkeydown=e=>{
  if(e.key==="ArrowRight")next();
  else if(e.key==="ArrowLeft")prev();
  else if(e.key===" "){e.preventDefault();toggleCard();}
};

// 触摸滑动切换
let touchX=null;
document.addEventListener("touchstart",e=>touchX=e.changedTouches[0].clientX,{passive:true});
document.addEventListener("touchend",e=>{
  if(touchX===null)return;
  const dx=e.changedTouches[0].clientX-touchX;
  if(Math.abs(dx)>60){dx<0?next():prev();}
  touchX=null;
},{passive:true});

// 加载数据
fetch("cards.json")
.then(r=>r.json())
.then(d=>{
  all=d;
  issue=issueList()[0]||"01";
  build();
})
.catch(()=>{
  $("term-view").style.display="block";
  $("sentence-view").style.display="none";
  $("term-front").textContent="无法读取 cards.json，请确保文件存在且格式正确。";
});
</script>
</body>
</html>
