<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f5f5f7">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>双语研习库</title>
<style>
:root {
  --bg-color: #f5f5f7;
  --card-bg: #ffffff;
  --text-main: #1d1d1f;
  --text-secondary: #86868b;
  --accent-blue: #0066cc;
  --accent-light: #e8f0fe;
  --border-color: #d2d2d7;
  --shadow-sm: 0 2px 10px rgba(0,0,0,0.03);
  --shadow-md: 0 10px 30px rgba(0,0,0,0.06);
}

* { box-sizing: border-box; }
body {
  margin: 0;
  background-color: var(--bg-color);
  color: var(--text-main);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  display: flex;
  flex-direction: column;
  min-height: 100vh;
}

/* 顶部标题区 */
header {
  padding: 20px 24px 10px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  max-width: 800px;
  margin: 0 auto;
  width: 100%;
}
.title-area h1 { margin: 0; font-size: 20px; font-weight: 600; letter-spacing: -0.02em; }
.title-area p { margin: 4px 0 0; font-size: 13px; color: var(--text-secondary); }

/* 极简工具栏 (期数、搜索、筛选) */
.toolbar {
  max-width: 650px;
  margin: 10px auto 20px;
  padding: 0 24px;
  width: 100%;
  display: flex;
  flex-direction: column;
  gap: 12px;
}
.issue-tabs {
  display: flex;
  gap: 8px;
  overflow-x: auto;
  padding-bottom: 4px;
}
.issue-tabs::-webkit-scrollbar { display: none; }
.tab-btn {
  background: #e8e8ed;
  color: var(--text-secondary);
  border: none;
  padding: 6px 16px;
  border-radius: 16px;
  font-size: 13px;
  font-weight: 500;
  cursor: pointer;
  white-space: nowrap;
  transition: all 0.2s;
}
.tab-btn.active {
  background: var(--text-main);
  color: #fff;
}
.search-row {
  display: flex;
  gap: 10px;
}
.search-input {
  flex: 1;
  border: 1px solid var(--border-color);
  border-radius: 12px;
  padding: 10px 14px;
  font-size: 14px;
  background: var(--card-bg);
  outline: none;
  box-shadow: var(--shadow-sm);
}
.search-input:focus { border-color: var(--accent-blue); }
.type-select {
  border: 1px solid var(--border-color);
  border-radius: 12px;
  padding: 10px 12px;
  font-size: 14px;
  background: var(--card-bg);
  color: var(--text-main);
  outline: none;
  box-shadow: var(--shadow-sm);
  cursor: pointer;
}

main {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 10px 24px 20px;
  max-width: 800px;
  margin: 0 auto;
  width: 100%;
}

/* Common Card Styles */
.card-wrapper {
  width: 100%;
  max-width: 600px;
  min-height: 380px;
  cursor: pointer;
  position: relative;
}
.tag {
  display: inline-block;
  background: var(--accent-light);
  color: var(--accent-blue);
  padding: 4px 10px;
  border-radius: 8px;
  font-size: 12px;
  font-weight: 600;
  margin-bottom: 20px;
}

/* --- 提示框优化 (手机/电脑更清晰) --- */
.note-box {
  background: #f9f9fb;
  border-left: 3px solid #d2d2d7;
  padding: 14px 18px; 
  border-radius: 0 8px 8px 0;
  font-size: 15.5px; 
  color: #2c2c2e; 
  margin-top: 24px;
  line-height: 1.75;
}

.hint-text {
  margin-top: auto;
  padding-top: 30px;
  text-align: center;
  font-size: 13px;
  color: var(--text-secondary);
}

/* 音频按钮：扩大触摸热区并消除移动端点击延迟 */
.play-btn {
  background: none;
  border: none;
  font-size: 20px;
  cursor: pointer;
  padding: 8px 12px;
  color: var(--accent-blue);
  border-radius: 20px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  transition: transform 0.1s, background-color 0.2s;
  min-width: 44px;
  min-height: 44px;
  touch-action: manipulation;
  -webkit-tap-highlight-color: transparent;
  user-select: none;
}
.play-btn:active {
  transform: scale(0.92);
  background-color: var(--accent-light);
}
.header-row { display: flex; justify-content: space-between; align-items: flex-start; }

/* --- Term Card (Flip) --- */
.term-container {
  perspective: 1400px;
  width: 100%;
  height: 100%;
  min-height: 380px;
}
.term-inner {
  position: relative;
  width: 100%;
  height: 100%;
  transition: transform 0.5s cubic-bezier(0.2, 0.8, 0.2, 1);
  transform-style: preserve-3d;
}
.term-inner.flip { transform: rotateY(180deg); }
.term-face {
  position: absolute;
  inset: 0;
  background: var(--card-bg);
  border-radius: 20px;
  box-shadow: var(--shadow-md);
  padding: 40px;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  text-align: center;
  backface-visibility: hidden;
  -webkit-backface-visibility: hidden;
}
.term-back { transform: rotateY(180deg); align-items: stretch; text-align: left; justify-content: flex-start; }
.term-text { font-size: 28px; font-weight: 600; line-height: 1.4; color: var(--text-main); flex: 1; display: flex; align-items: center; justify-content: center;}
.term-back .term-text { font-size: 22px; font-weight: 500; align-items: flex-start; margin-top: 10px;}

/* --- Sentence Card (Expand) --- */
.sentence-container {
  background: var(--card-bg);
  border-radius: 20px;
  box-shadow: var(--shadow-md);
  padding: 40px;
  display: flex;
  flex-direction: column;
  width: 100%;
  min-height: 380px;
  transition: all 0.3s ease;
}
.sentence-front {
  font-size: 20px;
  line-height: 1.8;
  font-weight: 500;
  color: var(--text-main);
}
.sentence-divider {
  height: 1px;
  background: var(--border-color);
  margin: 24px 0;
  opacity: 0.5;
}
.sentence-back-text {
  font-size: 18px;
  line-height: 1.7;
  color: #333336;
}

/* 控制与反馈区 */
.bottom-area {
  width: 100%;
  max-width: 600px;
  margin: 0 auto 30px;
  padding: 0 24px;
}
.nav-controls {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 20px;
}
.btn {
  background: #ffffff;
  border: 1px solid var(--border-color);
  color: var(--text-main);
  padding: 12px 20px;
  border-radius: 12px;
  font-size: 15px;
  font-weight: 500;
  cursor: pointer;
  box-shadow: var(--shadow-sm);
  transition: all 0.2s;
}
.btn:hover { background: #f9f9fb; }
.btn:active { transform: scale(0.97); }
.counter { font-size: 14px; color: var(--text-secondary); font-variant-numeric: tabular-nums; }

.feedback-controls {
  display: flex;
  justify-content: space-between;
  align-items: center;
  background: #ffffff;
  border-radius: 14px;
  padding: 8px;
  box-shadow: var(--shadow-sm);
  border: 1px solid var(--border-color);
}
.fb-btn {
  background: none; border: none; padding: 10px 16px; border-radius: 10px;
  font-size: 14px; font-weight: 500; cursor: pointer; color: var(--text-main);
}
.fb-btn:hover { background: var(--bg-color); }
.fb-btn.know { color: #008a00; }
.fb-btn.again { color: #d95000; }
.stats-text { font-size: 12px; color: var(--text-secondary); }

/* --- 手机端专项适配 --- */
@media(max-width: 600px) {
  .term-face, .sentence-container { padding: 30px 24px; }
  .term-text { font-size: 24px; }
  .term-back .term-text { font-size: 20px; }
  .sentence-front { font-size: 18px; }
  .sentence-back-text { font-size: 16px; }
  .search-row { flex-direction: column; }
  .note-box { font-size: 16.5px; padding: 16px; line-height: 1.8; }
}
</style>
</head>
<body>

<header>
  <div class="title-area">
    <h1>双语研习库</h1>
    <p>微聚点滴 · 砥学笃行</p>
  </div>
    <a href="index_planB.html" style="font-size:13px; color:var(--accent-blue); text-decoration:none; background:var(--accent-light); padding:6px 12px; border-radius:14px; font-weight:500;">📖 沉浸模式</a>
</header>

<!-- 工具栏 -->
<div class="toolbar">
  <div class="issue-tabs" id="issue-tabs"></div>
  <div class="search-row">
    <input type="text" class="search-input" id="search" placeholder="搜索中英文或标签...">
    <select class="type-select" id="type-select">
      <option value="all">全部类型</option>
      <option value="term">仅术语</option>
      <option value="sentence">仅句子</option>
    </select>
    <!-- 状态筛选下拉菜单 -->
    <select class="type-select" id="status-select">
      <option value="all">所有状态</option>
      <option value="wrong">🤔 需重练</option>
      <option value="known">✓ 已掌握</option>
    </select>
  </div>
</div>

<main>
  <div class="card-wrapper" id="card-area">
    
    <!-- 术语卡片：翻转 -->
    <div class="term-container" id="term-view" style="display: none;">
      <div class="term-inner" id="term-inner">
        <div class="term-face">
          <div class="tag" id="term-tag"></div>
          <div class="term-text" id="term-front"></div>
          <div class="hint-text">点击卡片查看对照</div>
        </div>
        <div class="term-face term-back">
          <div class="header-row">
            <div class="tag">参考译文</div>
            <button class="play-btn" id="play-term-back" title="朗读英文">🔊</button>
          </div>
          <div class="term-text" id="term-back"></div>
          <div class="note-box" id="term-note"></div>
        </div>
      </div>
    </div>

    <!-- 句子卡片：上下展开 -->
    <div class="sentence-container" id="sentence-view" style="display: none;">
      <div class="tag" id="sentence-tag"></div>
      <div class="sentence-front" id="sentence-front"></div>
      
      <div id="sentence-back-wrapper" style="display: none;">
        <div class="sentence-divider"></div>
        <div class="header-row" style="margin-bottom: 12px;">
          <div style="font-size: 12px; color: var(--text-secondary); font-weight: 600;">REFERENCE</div>
          <button class="play-btn" id="play-sentence-back" title="朗读英文">🔊</button>
        </div>
        <div class="sentence-back-text" id="sentence-back"></div>
        <div class="note-box" id="sentence-note"></div>
      </div>
      
      <div class="hint-text" id="sentence-hint">点击空白处展开对照</div>
    </div>

  </div>
</main>

<!-- 底部控制与进度区 -->
<div class="bottom-area">
  <div class="nav-controls">
    <button class="btn" id="btn-prev">← 上一页</button>
    <div class="counter" id="counter">1 / 6</div>
    <button class="btn" id="btn-next">下一页 →</button>
  </div>
  
  <div class="feedback-controls">
    <button class="fb-btn again" id="btn-again">🤔 需重练</button>
    <div class="stats-text">卡组进度: <span id="stat-known">0</span></div>
    <button class="fb-btn know" id="btn-know">✓ 已掌握</button>
  </div>
</div>

<script>
let allData = [];
let pool = [];
let currentIdx = 0;
let currentIssue = "01";
let state = JSON.parse(localStorage.getItem("bilingual-minimal-state") || '{"known":[],"wrong":[]}');

// --- 强制清洗旧数据：如果已经在“重练”里，就从“已掌握”剔除 ---
state.known = state.known.filter(id => !state.wrong.includes(id));

const $ = id => document.getElementById(id);

// --- 本地进度存储 ---
function saveState() {
  localStorage.setItem("bilingual-minimal-state", JSON.stringify(state));
}

// --- 全局 Audio 单例 (移动端必选) ---
const globalAudio = new Audio();

// 预解锁微信 iOS 内置浏览器音频限制
if (typeof WeixinJSBridge === 'object' && typeof WeixinJSBridge.invoke === 'function') {
  WeixinJSBridge.invoke('getNetworkType', {}, function () { globalAudio.load(); }, false);
} else {
  document.addEventListener("WeixinJSBridgeReady", function () { globalAudio.load(); }, false);
}

// --- 播放预生成的本地 MP3 文件 ---
function playCardAudio(id) {
  if (!id) return;
  globalAudio.pause();
  globalAudio.src = `audio/${id}.mp3`;
  globalAudio.play().catch(err => {
    console.error("音频播放失败", err);
  });
}
  
// --- 渲染期数 Tabs ---
function renderTabs() {
  const issues = [...new Set(allData.map(x => x.issue))].sort();
  if (issues.length === 0) return;
  if (!issues.includes(currentIssue)) currentIssue = issues[0];
  
  $('issue-tabs').innerHTML = issues.map(iss => 
    `<button class="tab-btn ${iss === currentIssue ? 'active' : ''}" data-iss="${iss}">第 ${iss} 期</button>`
  ).join('');
  
  document.querySelectorAll('.tab-btn').forEach(btn => {
    btn.onclick = () => {
      currentIssue = btn.getAttribute('data-iss');
      buildPool();
    };
  });
}

// --- 构建当前卡片池 (加入状态筛选逻辑) ---
function buildPool() {
  const query = $('search').value.trim().toLowerCase();
  const typeFilter = $('type-select').value;
  const statusFilter = $('status-select').value; 
  
  pool = allData.filter(card => {
    const matchIssue = card.issue === currentIssue;
    const matchType = typeFilter === 'all' || card.type === typeFilter;
    const matchSearch = !query || (card.front + " " + card.back + " " + card.tag).toLowerCase().includes(query);
    
    // 检查状态
    let matchStatus = true;
    if (statusFilter === 'known') matchStatus = state.known.includes(card.id);
    if (statusFilter === 'wrong') matchStatus = state.wrong.includes(card.id);
    
    return matchIssue && matchType && matchSearch && matchStatus;
  });
  
  currentIdx = 0;
  renderTabs(); 
  renderCard();
}

// --- 渲染卡片内容 ---
function renderCard() {
  globalAudio.pause(); 
  
  // 更新统计数据
  const knownCount = pool.filter(x => state.known.includes(x.id)).length;
  $('stat-known').textContent = `${knownCount} / ${pool.length} (已掌握)`;

  if (!pool.length) {
    $('counter').textContent = `0 / 0`;
    $('term-view').style.display = 'block';
    $('sentence-view').style.display = 'none';
    $('term-inner').classList.remove('flip');
    $('term-tag').textContent = "提示";
    $('term-front').textContent = "未找到符合条件的卡片";
    $('term-back').textContent = "";
    $('term-note').style.display = 'none';
    return;
  }

  const card = pool[currentIdx];
  $('counter').textContent = `${currentIdx + 1} / ${pool.length}`;

  if (card.type === 'term') {
    // 渲染术语
    $('term-view').style.display = 'block';
    $('sentence-view').style.display = 'none';
    $('term-inner').classList.remove('flip');

    $('term-tag').textContent = card.tag;
    $('term-front').textContent = card.front;
    $('term-back').textContent = card.back;
    
    if (card.note) {
      $('term-note').textContent = card.note;
      $('term-note').style.display = 'block';
    } else {
      $('term-note').style.display = 'none';
    }
  } else {
    // 渲染句子
    $('term-view').style.display = 'none';
    $('sentence-view').style.display = 'flex';
    $('sentence-back-wrapper').style.display = 'none';
    $('sentence-hint').style.display = 'block';

    $('sentence-tag').textContent = card.tag;
    $('sentence-front').textContent = card.front;
    $('sentence-back').textContent = card.back;

    if (card.note) {
      $('sentence-note').textContent = card.note;
      $('sentence-note').style.display = 'block';
    } else {
      $('sentence-note').style.display = 'none';
    }
  }
}

// --- 交互事件绑定 ---
$('term-view').onclick = () => $('term-inner').classList.toggle('flip');
$('sentence-view').onclick = () => {
  const wrapper = $('sentence-back-wrapper');
  const hint = $('sentence-hint');
  if (wrapper.style.display === 'none') {
    wrapper.style.display = 'block';
    hint.style.display = 'none';
  }
};

$('play-term-back').onclick = (e) => {
  e.preventDefault();
  e.stopPropagation();
  if (pool.length) playCardAudio(pool[currentIdx].id);
};
$('play-sentence-back').onclick = (e) => {
  e.preventDefault();
  e.stopPropagation();
  if (pool.length) playCardAudio(pool[currentIdx].id);
};

$('btn-prev').onclick = () => {
  if (!pool.length) return;
  currentIdx = (currentIdx - 1 + pool.length) % pool.length;
  renderCard();
};
$('btn-next').onclick = () => {
  if (!pool.length) return;
  currentIdx = (currentIdx + 1) % pool.length;
  renderCard();
};

// 学习反馈 (确保状态不矛盾)
$('btn-know').onclick = () => {
  if (!pool.length) return;
  const id = pool[currentIdx].id;
  if (!state.known.includes(id)) {
    state.known.push(id);
    state.wrong = state.wrong.filter(x => x !== id); // 从错题中移除
    saveState();
    
    // 如果当前处于“需重练”筛选模式，掌握后将当前卡片移出视图
    if ($('status-select').value === 'wrong') {
      buildPool();
      return; 
    }
  }
  $('btn-next').click();
  renderCard(); // 刷新统计数字
};

$('btn-again').onclick = () => {
  if (!pool.length) return;
  const id = pool[currentIdx].id;
  if (!state.wrong.includes(id)) {
    state.wrong.push(id);
    state.known = state.known.filter(x => x !== id); // 从已掌握中移除
    saveState();
    
    // 如果当前处于“已掌握”筛选模式，标为重练后移出视图
    if ($('status-select').value === 'known') {
      buildPool();
      return;
    }
  }
  $('btn-next').click();
  renderCard(); // 刷新统计数字
};

// 搜索与筛选监听
$('search').oninput = buildPool;
$('type-select').onchange = buildPool;
$('status-select').onchange = buildPool; 

// 键盘快捷键
document.onkeydown = (e) => {
  if (e.key === "ArrowRight") $('btn-next').click();
  else if (e.key === "ArrowLeft") $('btn-prev').click();
  else if (e.key === " ") {
    e.preventDefault();
    if (pool.length) {
      if (pool[currentIdx].type === 'term') $('term-view').click();
      else $('sentence-view').click();
    }
  }
};

// --- 初始加载 (带时间戳防止缓存) ---
fetch("cards.json?t=" + new Date().getTime())
  .then(res => res.json())
  .then(data => {
    allData = data;
    buildPool();
  })
  .catch(err => {
    $('term-front').textContent = "加载语料失败，请确认 cards.json 文件存在。";
    $('term-view').style.display = 'block';
  });
</script>
</body>
</html>
